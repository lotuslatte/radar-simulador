:root {
  --sb: 30px;
  --rg: #155240; --rg2: #49ac57; --rg3: #9fcfa7; --ro: #f26529; --ro2: #c8420a; --ink: #414042; --mut: #6a737b; --line: #dee2e6;
  --sys: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: #0f3d30; font-family: var(--sys); color: var(--ink); display: flex; align-items: center; justify-content: center; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
#app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

/* ---------- phone frame ---------- */
#phone { position: relative; width: 100vw; height: 100dvh; overflow: hidden; background: #000; }
@media (min-width: 520px) and (min-height: 700px) {
  #phone { width: 390px; height: min(844px, calc(100dvh - 32px)); border-radius: 44px; box-shadow: 0 0 0 10px #111, 0 0 0 11px #333, 0 30px 80px rgba(0,0,0,.5); }
}
#view { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }

/* RADAR kit styles shared by the prototypes (splash, guide, plan, help).

.rk-radar { position: relative; border-radius: 50%; background: radial-gradient(circle, #1f6e55 0%, #123f31 72%); overflow: hidden; box-shadow: 0 0 0 4px rgba(159,207,167,.22), 0 0 40px rgba(73,172,87,.35); flex-shrink: 0; }

  }
  function filler(app, title, ini, bg, hist, ts) {
    var k = 'f|' + app + '|' + title;

      msgs: hist.map(function (h) { return { id: ++seq, dir: h[0], kind: 'text', text: h[1], time: 'ayer', ticks: 3, s: [] }; }),

  }

  function skinOf(t) { return t.person ? 'wa' : SIM.APPS[t.app].skin; }

    t.msgs.push(m);
    t.ts = Date.now();
    t.time = m.time;
    if (m.dir !== 'sys') t.preview = (m.dir === 'out' ? 'Tú: ' : '') + previewText(m);
    if (visible(key)) { drawBody(true); }
    else if (m.dir === 'in') {

    }

  function previewText(m) {
    if (m.kind === 'photo') return m.dir === 'out' ? 'Foto' : (m.text || 'Foto');
    if (m.kind === 'del') return 'Se eliminó este mensaje';
    if (m.kind === 'post') return 'Compartió una publicación';
    if (m.kind === 'pay') return 'Yape ' + m.amount;
    if (m.kind === 'fwd') return 'Reenviado: captura de chat';
    if (m.kind === 'gift') return m.text;

  // ---------- the case flow ----------
  function startCase(id) {
    var c = E.caseById(id), run = E.newRun(id), k = caseKey(id, c.app, null), t = T[k];
    R[id] = run; CUR[id] = k; t.pending = false; t.unread = 0; t.msgs = []; t.ended = false; t.blocked = false; t.left = false; t.opts = null; t.result = null;
    t.request = c.app === 'instagram'; S.lastCase = id;
    intro(t, c);
    drawIfVisible(k);
    playNode(id, c.start);
  }

  // What the real app shows at the top of a new thread.
  function intro(t, c, chat) {
    var sk = skinOf(t);
    if (sk === 'wa') t.msgs.push({ id: ++seq, dir: 'sys', kind: 'crypto', s: [] });
    if (sk === 'ig' || sk === 'ms') t.msgs.push({ id: ++seq, dir: 'sys', kind: 'profile', lines: c.profile, s: [] });
    if (sk === 'wa' && t.unknown) t.msgs.push({ id: ++seq, dir: 'sys', kind: 'unknown', s: [] });
    if (sk === 'tg' && !chat) t.msgs.push({ id: ++seq, dir: 'sys', kind: 'text', text: 'Te uniste al canal desde un enlace compartido', s: [] });
  }

  function threadFor(id, app, chat) {
    var c = E.caseById(id), k = caseKey(id, app, chat);
    if (!T[k]) {
      var wa = app === 'whatsapp';
      T[k] = { key: k, app: app, caseId: id, title: chat ? chat.name : wa ? (c.phone || c.name) : c.name, push: chat ? '' : (c.push || c.name),
        initials: chat ? chat.initials : c.initials, bg: chat ? chat.bg : c.bg, sub: chat ? chat.sub : wa ? 'en línea' : c.lastSeen,
        msgs: [], unread: 0, preview: '', time: now(), ts: Date.now(), unknown: wa, channel: false, group: !!chat && /miembros/.test(chat.sub || '') };
      intro(T[k], c, chat);
    }
    return k;
  }

  async function playNode(id, nodeId) {
    var run = R[id], prev = CUR[id];
    BUSY[id] = true;
    var r = E.enter(run, nodeId);
    var k = threadFor(id, run.app, run.chat);
    if (k !== prev) await handoff(id, prev, k);
    CUR[id] = k;
    await playIncoming(k, r.items);
    if (r.pausa && hints() !== 'ninguna') headsup({ app: 'radar', kind: 'pause', title: 'Pausa · ' + SIM.PAUSA[0], text: SIM.PAUSA[1], expand: true });
    BUSY[id] = false;
    T[k].opts = shuffle(E.options(run));
    drawIfVisible(k);
  }
  // Options come in a new order each time, so the safe one is not always in the same place.
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }

  async function handoff(id, from, to) {
    var a = T[from], b = T[to];
    if (a.app !== b.app) pushMsg(from, { dir: 'sys', kind: 'text', text: 'Le pasaste tu número. Ahora te escribe por ' + APPNAME[b.app] + '.' });
    else if (b.group) pushMsg(from, { dir: 'sys', kind: 'text', text: 'Te agregaron al grupo «' + b.title + '»' });
    else pushMsg(from, { dir: 'sys', kind: 'text', text: b.title + ' te escribió por privado' });
    await sleep(900);
    var wasHere = visible(from);
    headsup({ app: b.app, title: b.title, text: 'Nuevo chat', onTap: function () { openThread(to); } });
    if (wasHere) { await sleep(700); openThread(to); }
  }

  async function playIncoming(key, items) {
    var t = T[key];
    await sleep(250);
    readOut(key);
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.kind === 'sys') { await sleep(420); pushMsg(key, { dir: 'sys', kind: 'text', text: it.text, s: it.s }); continue; }
      var len = (it.text || '').length;
      t.typing = it.from || true; drawHead(key); drawBody(true, key);
      await sleep(600 + Math.min(len * 13, 1100));
      t.typing = false;
      var m = Object.assign({ dir: 'in' }, it);
      if (it.kind === 'in') m.kind = 'text';
      pushMsg(key, m);
      drawHead(key);
      if (it.kind === 'pay') headsup({ app: 'yape', title: 'Yape', text: '¡Te yapearon ' + it.amount + '! De ' + (it.from || 'un número'), onTap: null });
      if (it.kind === 'pay') { store.pays.unshift({ dir: 'in', amount: it.amount, from: it.from, time: now() }); save(); }
    }
  }

  function readOut(key) {
    var ch = false;
    T[key].msgs.forEach(function (m) { if (m.dir === 'out' && m.ticks < 3) { m.ticks = 3; ch = true; } });
    if (ch && visible(key)) drawBody(false);
  }

  async function onChoose(id, i) {
    var run = R[id], k = CUR[id], t = T[k];
    if (BUSY[id] || run.ended) return;
    BUSY[id] = true; t.opts = null; drawFoot();
    var res = E.choose(run, i), o = res.opt;
    if (o.say) { t.request = false; await typeAndSend(k, o.say); }
    var dos = o.do || [];
    for (var j = 0; j < dos.length; j++) await doGesture(id, dos[j], k, { ending: res.end });
    if (res.fb && hints() !== 'ninguna') fbToast(res.fb);
    if (res.fb && res.fb.kind === 'alert' && res.fb.fn && hints() !== 'ninguna') pingSignal(k, res.fb.fn);
    if (res.reply.length) await playIncoming(k, res.reply);
    BUSY[id] = false;
    if (res.next) await playNode(id, res.next);
    else finishCase(id, E.finish(run, res.m, res.harm));
  }

  async function typeAndSend(key, text) {
    var t = T[key];
    if (visible(key)) {
      var steps = Math.min(text.length, 18);
      for (var s = 1; s <= steps; s++) { t.draft = text.slice(0, Math.ceil(text.length * s / steps)); drawInput(); await sleep(22); }
      await sleep(160);
    }
    t.draft = '';
    var m = pushMsg(key, { dir: 'out', kind: 'text', text: text, ticks: 1 });
    drawInput();
    await sleep(350); m.ticks = 2; if (visible(key)) drawBody(false);
  }

  async function doGesture(id, d, key, ctx) {
    var t = T[key];
    if (d === 'captura') { await capture(key); return; }
    if (d === 'reporta') { pushMsg(key, { dir: 'sys', kind: 'text', text: t.channel || t.group ? 'Reportaste este ' + (t.channel ? 'canal' : 'grupo') : 'Reportaste esta cuenta' }); await sleep(500); return; }
    if (d === 'bloquea') { t.blocked = true; pushMsg(key, { dir: 'sys', kind: 'text', text: 'Bloqueaste a este contacto' }); await sleep(500); return; }
    if (d === 'salir') { t.left = true; pushMsg(key, { dir: 'sys', kind: 'text', text: 'Saliste del ' + (t.channel ? 'canal' : 'grupo') }); await sleep(500); return; }
    if (d === 'silencio') { pushMsg(key, { dir: 'sys', kind: 'text', text: 'No respondiste' }); await sleep(400); return; }
    if (d.tell) { await tellFlow(id, d.tell, { text: d.text, reply: d.reply, from: key, wait: !ctx.ending }); return; }
    if (d.call) { await callFlow(d.call); pushMsg(key, { dir: 'sys', kind: 'text', text: 'Llamaste a la ' + d.call }); return; }
    if (d.avisa || d.verifica || d.sys) { await sleep(300); pushMsg(key, { dir: 'sys', kind: 'text', text: d.avisa || d.verifica || d.sys }); await sleep(600); return; }
    if (d.photos) { for (var i = 0; i < d.photos; i++) { pushMsg(key, { dir: 'out', kind: 'photo', ticks: 2 }); await sleep(250); } return; }
    if (d.payOut) {
      pushMsg(key, { dir: 'out', kind: 'pay', amount: d.payOut, ticks: 2 });
      store.pays.unshift({ dir: 'out', amount: d.payOut, from: t.title, time: now() }); save();
      await sleep(400);
    }
  }

  // Forward the chat as a capture to a person, show their answer, and wait for
  // her to come back when the case goes on.
  async function tellFlow(id, who, o) {
    var c = E.caseById(id), pk = 'p|' + who, p = SIM.PEOPLE[who];
    S.returnTo = null;
    openThread(pk);
    await sleep(500);
    pushMsg(pk, { dir: 'out', kind: 'fwd', caseTitle: T[o.from].title, app: T[o.from].app, lines: lastLines(o.from), ticks: 2 });
    if (o.text) { await sleep(300); await typeAndSend(pk, o.text); }
    var reply = o.reply || (c.tell && c.tell[who]) || p.reply;
    await playIncoming(pk, reply.map(function (x) { return { kind: 'in', text: x, s: [] }; }));
    if (p.note) pushMsg(pk, { dir: 'sys', kind: 'text', text: p.note });
    if (!o.wait) { await sleep(900); return; }
    await new Promise(function (resolve) { S.returnTo = { key: o.from, resolve: resolve }; drawFoot(); });
  }
  function lastLines(key) {

  // ---------- heads-up notifications ----------

  function bindShade(phone) {

    var seen = rendered[t.key] || 0, html = '', prev = null;
    t.msgs.forEach(function (m) { html += msgHTML(t, m, sk, m.id > seen, prev); prev = m; });
    rendered[t.key] = t.msgs.length ? t.msgs[t.msgs.length - 1].id : 0;
    if (sk === 'ig') {
      var lastOut = null; t.msgs.forEach(function (m) { if (m.dir === 'out') lastOut = m; });
      if (lastOut && lastOut.ticks >= 3) html += '<div class="ig-seen">Visto</div>';
    }
    if (t.typing) html += sk === 'ff' ? '<div class="ff-line typing">' + esc(t.title) + ' está escribiendo…</div>' : '<div class="msg in typing first"><div class="bub"><i></i><i></i><i></i></div></div>';
    b.innerHTML = html;
    if (scroll || atBottom) b.scrollTop = b.scrollHeight;
    bindBody(b);
  }

  function bindBody(b) {
    var key = S.key, timer = null, startX = 0, startY = 0;
    b.querySelectorAll('[data-act="u-block"]').forEach(function (x) { x.onclick = function () { menuBlock(key); }; });
    b.querySelectorAll('[data-act="u-report"]').forEach(function (x) { x.onclick = function () { menuReport(key); }; });
    b.querySelectorAll('[data-act="profile"]').forEach(function (x) { x.onclick = function () { go('profile'); }; });
    b.querySelectorAll('[data-ping]').forEach(function (x) {
      x.onclick = function (e) {
        e.stopPropagation();
        var m = T[key].msgs.filter(function (y) { return y.id === +x.dataset.ping; })[0];
        sheet('<div class="fb-sheet alert"><span class="fb-k">Tu radar detectó</span><h3>' + esc(SIM.FN[m.ping][0]) + '</h3><p>' + esc(SIM.FN[m.ping][1]) + '</p><button class="rk-btn primary" data-close>Entendido</button></div>');
      };
    });
    function open(el) {
      var mid = +el.dataset.mid, m = T[key].msgs.filter(function (y) { return y.id === mid; })[0];
      if (!m) return;
      el.classList.add('held');
      var items = [];
      if (m.dir === 'in') items.push([m.flagged ? 'Ya lo marcaste' : 'Marcar como sospechoso', function () { flagMsg(key, mid); }, I.flag]);
      items.push(['Captura de pantalla', function () { capture(key); }, I.shot]);
      if (T[key].caseId) items.push(['Reenviar a alguien de confianza', function () { pickPerson(key); }, I.fwd]);
      if (m.dir === 'in' && T[key].caseId) items.push(['Reportar', function () { menuReport(key); }, I.report, 1]);
      menu(items);
      setTimeout(function () { el.classList.remove('held'); }, 400);
    }
    b.onpointerdown = function (e) {
      var el = e.target.closest('.msg[data-mid], .ff-line[data-mid]');
      if (!el) return;
      startX = e.clientX; startY = e.clientY;
      timer = setTimeout(function () { timer = null; open(el); }, 450);
    };
    b.onpointermove = function (e) { if (timer && (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8)) { clearTimeout(timer); timer = null; } };
    b.onpointerup = b.onpointercancel = function () { if (timer) { clearTimeout(timer); timer = null; } };
    b.oncontextmenu = function (e) {
      var el = e.target.closest('.msg[data-mid], .ff-line[data-mid]');
      if (!el) return;
      e.preventDefault(); open(el);
    };
  }

  function drawFoot() {
    var f = document.getElementById('ch-foot');
    if (!f || S.view !== 'chat') return;
    var t = T[S.key], sk = skinOf(t), html = '';
    if (S.returnTo && t.person) {
      var rt = T[S.returnTo.key];
      html += '<button class="return-bar" data-act="return">' + I.back + 'Volver al chat con ' + esc(rt.push || rt.title) + '</button>';
    }
    if (t.opts && t.opts.length && t.chipsMin) {
      html += '<button class="chips-min' + (sk === 'ff' ? ' ff' : '') + '" data-act="chips-open">Responder · ' + t.opts.length + ' opciones<i>▴</i></button>';
    } else if (t.opts && t.opts.length) {
      html += '<div class="chips' + (sk === 'ff' ? ' ff' : '') + '"><span class="chips-l">Elige tu respuesta<button data-act="chips-hide">Ver el chat ▾</button></span>' + t.opts.map(function (o) {
        return '<button class="chip' + (o.say && !o.action ? ' say' : ' act') + '" data-opt="' + o.i + '">' + (o.say && !o.action ? '' : '<i>' + actIcon(o) + '</i>') + esc(o.label) + '</button>';
      }).join('') + '</div>';
    }
    if (t.person === 'radar' && t.topics) {
      html += '<div class="chips"><span class="chips-l">¿Qué te está pasando?</span>' + SIM.TOP.map(function (tp, i) { return '<button class="chip say' + (t.used && t.used[i] ? ' used' : '') + '" data-topic="' + i + '">' + esc(tp[0]) + '</button>'; }).join('') + '</div>';
    }
    if (t.ended && t.caseId) html += '<div class="chips"><button class="chip end" data-act="debrief">' + I.eye + 'Ver tu recorrido</button><button class="chip act" data-act="restart">Volver a intentarlo</button></div>';
    html += inputHTML(t, sk);
    f.className = 'ch-foot ' + sk;
    f.innerHTML = html;
    f.querySelectorAll('[data-opt]').forEach(function (b) { b.onclick = function () { t.chipsMin = false; onChoose(t.caseId, +b.dataset.opt); }; });
    var ch = f.querySelector('[data-act="chips-hide"]');
    if (ch) ch.onclick = function () { t.chipsMin = true; drawFoot(); };
    var co = f.querySelector('[data-act="chips-open"]');
    if (co) co.onclick = function () { t.chipsMin = false; drawFoot(); };
    var bd = document.getElementById('ch-body');
    if (bd && bd._pinned) bd.scrollTop = bd.scrollHeight;
    f.querySelectorAll('[data-topic]').forEach(function (b) { b.onclick = function () { radarTopic(+b.dataset.topic); }; });
    var r = f.querySelector('[data-act="return"]');
    if (r) r.onclick = function () { var x = S.returnTo; S.returnTo = null; openThread(x.key); x.resolve(); };
    var d = f.querySelector('[data-act="debrief"]');
    if (d) d.onclick = function () { openDebrief(t.caseId); };
    var rs = f.querySelector('[data-act="restart"]');
    if (rs) rs.onclick = function () { restartCase(t.caseId); };
    f.querySelectorAll('[data-req]').forEach(function (b) {
      b.onclick = function () {
        var k = b.dataset.req;
        if (k === 'block') menuBlock(S.key);
        else if (k === 'delete') { var run = needIdle(S.key); if (run) doGesture(run.id, { sys: 'Eliminaste la solicitud' }, S.key, {}).then(function () { E.gesture(run, 'silencio'); finishCase(run.id, E.finish(run, run.path[run.path.length - 1], false)); }); }
        else { t.request = false; drawFoot(); }
      };
    });
  }
  function actIcon(o) {
    var l = o.label.toLowerCase();
    if (/bloque/.test(l)) return I.block;
    if (/report/.test(l)) return I.report;
    if (/captur/.test(l)) return I.shot;
    if (/chat 100|línea|llamar/.test(l)) return I.help;
    if (/mamá|kim|mostr|cont|pregunt|avis|comentar|reenv|pasarle/.test(l)) return I.fwd;
    if (/salir|irme|no respond|dejar|visto/.test(l)) return I.exit;
    return I.send;
  }

  function inputHTML(t, sk) {
    var draft = t.draft || '';
    var disabled = t.blocked ? 'Bloqueaste a este contacto' : t.left ? 'Ya no eres parte de este ' + (t.channel ? 'canal' : 'grupo') : '';
    if (disabled) return '<div class="in-bar off">' + esc(disabled) + '</div>';
    if (t.request && t.caseId) {
      return '<div class="ig-req"><p>¿Quieres que <b>' + esc(t.title) + '</b> también pueda enviarte mensajes? No sabrá que viste su solicitud hasta que aceptes.</p><div><button data-req="block">Bloquear</button><button data-req="delete">Eliminar</button><button data-req="accept">Aceptar</button></div></div>';
    }
    if (t.channel) return '<div class="in-bar tg-ch"><span>' + (draft ? esc(draft) : 'SILENCIAR') + '</span></div>';
    var text = draft ? '<span class="in-text">' + esc(draft) + '</span>' : '<span class="in-ph">' + ({ wa: 'Mensaje', ig: 'Enviar mensaje…', ms: 'Aa', tg: 'Mensaje', ff: 'Escribe un mensaje' }[sk]) + '</span>';
    if (sk === 'wa') return '<div class="in-bar wa"><span class="in-f">' + I.smile + text + I.clip + I.cam + '</span><span class="in-btn">' + (draft ? I.send : I.mic) + '</span></div>';
    if (sk === 'ig') return '<div class="in-bar ig"><span class="in-f"><span class="in-cam">' + I.cam + '</span>' + text + (draft ? '<b class="in-send">Enviar</b>' : I.mic + I.image) + '</span></div>';
    if (sk === 'ms') return '<div class="in-bar ms"><span class="ib">' + I.cam + '</span><span class="ib">' + I.image + '</span><span class="in-f">' + text + I.smile + '</span><span class="ib">' + (draft ? I.send : I.mic) + '</span></div>';
    if (sk === 'tg') return '<div class="in-bar tg">' + I.smile + text + I.clip + '<span class="in-btn">' + (draft ? I.send : I.mic) + '</span></div>';
    return '<div class="in-bar ff"><span class="in-f">' + text + '</span><b class="ff-send">ENVIAR</b></div>';
  }
  function drawInput() {
    var f = document.getElementById('ch-foot');
    if (!f || S.view !== 'chat') return;
    var t = T[S.key], bar = f.querySelector('.in-bar, .ig-req');
    if (bar) bar.outerHTML = inputHTML(t, skinOf(t));
  }

  function restartCase(id) {
    var c = E.caseById(id);
    Object.keys(T).forEach(function (k) { if (T[k].caseId === id && k !== caseKey(id, c.app, null)) delete T[k]; });
    var k = caseKey(id, c.app, null);
    T[k].pending = true;
    delete R[id];
    openThread(k, S.back && S.back.view);
  }

  // ----- RADAR companion chat -----
  async function startRadarChat() {
    var k = 'p|radar', t = T[k];
    t.msgs = [];
    await playIncoming(k, SIM.ACI.map(function (x) { return { kind: 'in', text: x, s: [] }; }));
    pushMsg(k, { dir: 'sys', kind: 'text', text: 'Ayuda gratuita: Chat 100 (escribir, 24 h) · Línea 100 (llamar, 24 h) · Línea 1818 (denuncia anónima de trata)' });
    t.topics = true; t.used = t.used || {};
    drawIfVisible(k);
  }
  async function radarTopic(i) {
    var k = 'p|radar', t = T[k];
    t.topics = false; drawFoot();
    t.used[i] = true;
    await typeAndSend(k, SIM.TOP[i][0]);
    await playIncoming(k, SIM.TOP[i][1].map(function (x) { return { kind: 'in', text: x, s: [] }; }));
    t.topics = true; drawIfVisible(k);
  }

  // ----- profile -----
  function renderProfile() {
    var t = T[S.key], c = E.caseById(t.caseId), sk = skinOf(t), v = view();
    setTone('light');
    v.className = 'v-profile skin-' + sk;
    v.innerHTML = '<header class="pf-head"><button class="ib" data-act="back">' + I.back + '</button><span>' + (sk === 'wa' ? 'Info. del contacto' : 'Perfil') + '</span></header>' +
      '<div class="pf-top"><span class="av big' + (sk === 'ig' ? ' ring' : '') + '" style="background:' + t.bg + '">' + esc(t.initials) + '</span><h2>' + esc(t.title) + '</h2>' +
      (t.push && sk === 'wa' ? '<p>~' + esc(t.push) + '</p>' : '') + '</div>' +
      '<section class="pf-card">' + c.profile.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') + '</section>' +
      '<p class="pf-tip">Fíjate en la antigüedad de la cuenta, su actividad y los comentarios de otras personas.</p>' +
      '<section class="pf-card pf-act"><button data-act="pf-shot">' + I.shot + 'Hacer captura del perfil</button>' +
      (t.ended ? '' : '<button data-act="pf-report" class="danger">' + I.report + 'Reportar</button><button data-act="pf-block" class="danger">' + I.block + (t.channel || t.group ? 'Salir' : 'Bloquear') + '</button>') + '</section>';
    v.querySelector('[data-act="back"]').onclick = function () { go('chat'); };
    v.querySelector('[data-act="pf-shot"]').onclick = function () { capture(S.key); };
    var pr = v.querySelector('[data-act="pf-report"]');
    if (pr) pr.onclick = function () { go('chat'); menuReport(S.key); };
    var pb = v.querySelector('[data-act="pf-block"]');
    if (pb) pb.onclick = function () { go('chat'); if (t.channel || t.group) menuLeave(S.key); else menuBlock(S.key); };
  }

  // ----- debrief -----
  function openDebrief(id) { S.debrief = id; document.getElementById('heads').innerHTML = ''; go('debrief'); }

  function renderDebrief() {
    var id = S.debrief, run = R[id], res = run && run.result, c = E.caseById(id), v = view();
    setTone('dark');
    v.className = 'v-debrief';
    if (!res) { v.innerHTML = '<div class="db-top"><p>Este chat todavía no termina.</p></div>'; return; }
    var STATE = { marcaste: ['Lo marcaste', 'st-mine'], radar: ['Te lo mostró el radar', 'st-radar'], 'pasó': ['Pasó sin marcar', 'st-miss'] };
    v.innerHTML = '<header class="db-head"><button class="ib" data-act="close">' + I.back + '</button><span>Tu recorrido · ' + esc(c.push || c.name) + '</span></header>' +
      '<div class="db-scroll"><section class="db-top ' + (res.harm ? 'harm' : 'ok') + '"><span class="db-k">' + (res.harm ? 'Hasta aquí llegó la conversación' : 'Así saliste') + '</span><h2>' + esc(res.title) + '</h2><p>' + esc(res.body) + '</p></section>' +
      '<section class="db-card"><h3>Tu recorrido</h3><ol class="db-steps">' + res.steps.map(function (s) { return '<li class="' + (s.inPath ? 'in' : s.reached ? 'on' : '') + '">' + esc(s.label) + '</li>'; }).join('') + '</ol></section>' +
      '<section class="db-card"><h3>Lo que hiciste, letra por letra</h3>' + res.letters.map(function (l) { return '<div class="db-l ' + (l.on ? 'on' : '') + '"><span>' + l.letter + '</span><div><b>' + esc(l.name) + '</b><small>' + esc(l.detail) + '</small></div></div>'; }).join('') + '</section>' +
      '<section class="db-card"><h3>Señales en esta conversación</h3><p class="db-m">Las señales se agrupan en ocho funciones, según lo que busca cada mensaje. Lo que no es señal: tener un perfil público, pasar horas en línea o conocer gente por internet.</p>' +
      res.signals.map(function (s) { var st = STATE[s.state]; return '<div class="db-sig"><div><b>' + esc(s.name) + '</b><small>' + esc(s.busca) + '</small></div><i class="' + st[1] + '">' + st[0] + '</i></div>'; }).join('') +
      res.warns.map(function (w) { return '<p class="db-warn">' + esc(w) + '</p>'; }).join('') + '</section>' +
      (res.exits.length ? '<section class="db-card"><h3>Otras salidas que tenías</h3>' + res.exits.map(function (x) { return '<p class="db-exit"><small>' + esc(x.moment) + '</small>' + esc(x.label) + '</p>'; }).join('') + '</section>' : '') +
      '<section class="db-card"><h3>Puedes sumar</h3><ul class="db-add">' + res.add.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></section>' +
      (res.fbs.length ? '<details class="db-card"><summary><h3>Lo que te dijo el radar (' + res.fbs.length + ')</h3></summary>' + res.fbs.map(function (f) { return '<div class="db-fb ' + f.kind + '"><small>' + esc(f.choice) + '</small><b>' + esc(f.title) + '</b><p>' + esc(f.text) + '</p></div>'; }).join('') + '</details>' : '') +
      '<section class="db-help">No es tu culpa. Ayuda gratuita: <b>Chat 100</b> (escribir, 24 h) · <b>Línea 100</b> (llamar, 24 h) · <b>Línea 1818</b> (denuncia anónima de trata).</section>' +
      '<div class="db-btns"><button class="rk-btn primary" data-act="again">Probar otro camino</button><button class="rk-btn ghost" data-act="home">Ir al inicio</button></div></div>';
    v.querySelector('[data-act="close"]').onclick = function () { go('chat'); };
    v.querySelector('[data-act="again"]').onclick = function () { restartCase(id); };
    v.querySelector('[data-act="home"]').onclick = function () { go('home'); };
  }

  // ----- RADAR app -----
  function renderRadarApp() {
    setTone('dark');
    var tab = S.radarTab || 'chats', v = view();
    var tabs = [['chats', 'Mis chats'], ['guia', 'Guía'], ['plan', 'Mi plan'], ['ahora', 'Ayuda'], ['ajustes', 'Ajustes']];
    v.className = 'v-radar';
    v.innerHTML = '<header class="ra-head"><button class="ib" data-act="home">' + I.back + '</button><b>RADAR</b><span>Reconoce · Asegúrate · Decide · Actúa · Reporta</span></header>' +
      '<nav class="ra-tabs">' + tabs.map(function (x) { return '<button data-tab="' + x[0] + '" class="' + (tab === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</nav><div class="ra-body" id="ra-body"></div>';
    v.querySelector('[data-act="home"]').onclick = function () { go(S.radarBack || 'home'); };
    v.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { S.radarTab = b.dataset.tab; renderRadarApp(); }; });
    var body = document.getElementById('ra-body');
    if (tab === 'guia' || tab === 'plan' || tab === 'ahora') { RK.mount(body, tab); return; }
    if (tab === 'ajustes') {
      var opt = function (k, vals) { return vals.map(function (x) { return '<button class="rk-chip' + (store.settings[k] === x[0] ? ' on' : '') + '" data-set="' + k + '" data-v="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join(''); };
      body.innerHTML = '<section class="rk-card"><h3>Pistas del radar</h3><p class="rk-muted">Cuánto te avisa el radar mientras chateas. El análisis completo siempre aparece al final.</p>' +
        opt('hints', [['sutiles', 'Sutiles: un aviso breve arriba'], ['ninguna', 'Ninguna: solo al final'], ['siempre', 'Siempre: muestra cada señal']]) + '</section>' +
        '<section class="rk-card"><h3>Velocidad de los mensajes</h3>' + opt('pace', [['normal', 'Normal'], ['rápido', 'Rápida']]) + '</section>' +
        '<section class="rk-card"><h3>Empezar de nuevo</h3><p class="rk-muted">Borra tus recorridos, capturas y pagos de este celular. Tu plan RADAR se mantiene.</p><button class="rk-btn ghost dark" data-act="reset">Borrar mi avance</button></section>';
      body.querySelectorAll('[data-set]').forEach(function (b) { b.onclick = function () { store.settings[b.dataset.set] = b.dataset.v; save(); renderRadarApp(); }; });
      body.querySelector('[data-act="reset"]').onclick = function () {
        dialog('¿Borrar tu avance?', 'Se borran los recorridos, las capturas y los pagos simulados.', [['Borrar', function () {
          store.done = {}; store.gallery = []; store.pays = []; store.coach = {}; save(); initThreads(); NOTES = []; S.lastCase = null; go('lock');
        }], ['Cancelar', null]]);
      };
      return;
    }
    body.innerHTML = '<p class="rk-muted">Cada chat es una situación ficticia. Ábrelo desde su app o desde aquí.</p>' + SIM.cases.slice().sort(function (a, b) { return a.order - b.order; }).map(function (c) {
      var d = store.done[c.id], run = R[c.id];
      var st = run && run.ended ? '<i class="ra-st ' + (run.result.harm ? 'h' : 'ok') + '">' + esc(run.result.title) + '</i>' : run ? '<i class="ra-st cur">En curso</i>' : d ? '<i class="ra-st ' + (d.harm ? 'h' : 'ok') + '">' + esc(d.title) + '</i>' : '<i class="ra-st">Sin abrir</i>';
      return '<button class="ra-case" data-case="' + c.id + '">' + appIcon(c.app, 36) + '<span><b>' + esc(c.push || c.name) + '</b><small>' + esc(APPNAME[c.app]) + ' · ' + esc(c.preview) + '</small>' + st + '</span></button>';
    }).join('');
    body.querySelectorAll('[data-case]').forEach(function (b) {
      b.onclick = function () {
        var id = b.dataset.case, run = R[id];
        if (run && run.ended) return openDebrief(id);
        openThread(CUR[id], 'radar');
      };
    });
  }

  function renderGallery() {
    setTone('light');
    var v = view();
    v.className = 'v-gallery';
    v.innerHTML = '<header class="ga-head"><button class="ib" data-act="home">' + I.back + '</button><b>Capturas de pantalla</b></header>' +
      (store.gallery.length ? '<div class="ga-grid">' + store.gallery.map(function (g, i) {
        return '<button class="ga-shot ' + (SIM.APPS[g.app] ? SIM.APPS[g.app].skin : 'wa') + '" data-g="' + i + '"><b>' + esc(g.title) + '</b>' + g.lines.map(function (l) { return '<i>' + esc(l) + '</i>'; }).join('') + '<small>' + esc(g.time) + '</small></button>';
      }).join('') + '</div>' : '<p class="ga-empty">Todavía no tienes capturas. En un chat, usa ⋮ o mantén presionado un mensaje para hacer una. Capturar antes de bloquear guarda las pruebas.</p>');
    v.querySelector('[data-act="home"]').onclick = function () { go('home'); };
  }

  function renderYape() {
    setTone('dark');
    var v = view();
    v.className = 'v-yape';
    v.innerHTML = '<header class="yp-head"><button class="ib" data-act="home">' + I.back + '</button><b>Movimientos</b></header>' +
      (store.pays.length ? store.pays.map(function (p) {
        return '<div class="yp-row"><span><b>' + esc(p.from || '') + '</b><small>Hoy ' + esc(p.time) + '</small></span><i class="' + p.dir + '">' + (p.dir === 'in' ? '+ ' : '- ') + esc(p.amount) + '</i></div>';
      }).join('') + '<p class="yp-tip">Lo que te regalan o adelantan hoy te lo pueden cobrar mañana.</p>' : '<p class="yp-tip">Sin movimientos. Los yapes de las conversaciones simuladas aparecen aquí.</p>');
    v.querySelector('[data-act="home"]').onclick = function () { go('home'); };
  }

  // ---------- boot ----------
  function boot() {
    document.getElementById('app').innerHTML = '<div id="phone" data-tone="dark"><div id="sb" class="statusbar"></div><div id="view"></div><div id="heads"></div><div id="layer"></div><div id="flash"></div><div class="homebar"></div></div>';
    bindShade(document.getElementById('phone'));
    initThreads();
    if (params.has('nointro')) S.view = 'lock';
    render();
    setInterval(function () { var el = document.querySelector('.sb-time'); if (el) el.textContent = now(); }, 30000);
  }
  window.SIMAPP = { state: S, threads: function () { return T; }, runs: function () { return R; }, store: store };
  boot();
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
